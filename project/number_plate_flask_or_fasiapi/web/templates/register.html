<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiScan | Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary-gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      --text-main: #ffffff;
      --text-muted: #f1f5f9;
    }

    p,
    .text-muted {
      color: #f1f5f9 !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8) !important;
    }

    body {
      background-color: #0f172a;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      margin: 0;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Animated background elements */
    .bg-blob {
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, transparent 70%);
      filter: blur(80px);
      z-index: -1;
      animation: float 20s infinite alternate;
    }

    .blob-1 {
      top: -100px;
      left: -100px;
    }

    .blob-2 {
      bottom: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
    }

    @keyframes float {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(100px, 50px);
      }
    }

    .brand-logo {
      font-weight: 700;
      font-size: 2.2rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 48px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      margin: 20px;
      position: relative;
      z-index: 10;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-control {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      padding: 14px 18px;
    }

    .form-control:focus {
      background: rgba(0, 0, 0, 0.4);
      border-color: #a855f7;
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1);
      color: white;
    }

    .form-control::placeholder {
      color: #cbd5e1 !important;
      opacity: 0.8;
    }

    .form-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .btn-register {
      background: var(--primary-gradient);
      border: none;
      padding: 16px 40px;
      border-radius: 12px;
      font-weight: 600;
      color: white;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      width: 100%;
    }

    .btn-register:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.5);
      color: white;
    }

    .login-link {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
    }

    .login-link a {
      color: #a855f7;
      text-decoration: none;
      font-weight: 600;
    }

    .password-hint {
      font-size: 0.75rem;
      margin-top: 8px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .requirement-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
      transition: all 0.3s ease;
    }

    .requirement-dot.met {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
    }

    .alert-custom {
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 0.9rem;
      border: none;
      background: rgba(244, 63, 94, 0.1);
      color: #fb7185;
    }

    .alert-success-custom {
      background: rgba(34, 197, 94, 0.1) !important;
      color: #4ade80 !important;
    }
  </style>
</head>

<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="glass-card">
    <div class="text-center mb-5">
      <a href="/login" class="brand-logo">INDISCAN</a>
      <p class="text-muted mt-2">Intelligence Network Access</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert-custom {{ 'alert-success-custom' if category == 'success' else '' }}" role="alert">
      {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div id="errorAlert" class="alert-custom d-none" role="alert"></div>
    <div id="successAlert" class="alert-custom d-none" role="alert"
      style="background: rgba(34, 197, 94, 0.1); color: #4ade80;"></div>

    <form id="registerForm">
      <div class="row g-4">
        <div class="col-12">
          <label class="form-label mb-2">Operational Identity</label>
          <input type="text" class="form-control" id="username" placeholder="Choose username" required minlength="3">
        </div>

        <div class="col-12">
          <label class="form-label mb-2">Secure Email</label>
          <input type="email" class="form-control" id="email" placeholder="agent@indiscan.gov" required>
        </div>

        <div class="col-12">
          <label class="form-label mb-2">System Key</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
          <div class="password-hint">
            <span class="requirement-dot" id="lengthDot"></span>
            <span>Policy: Minimum 6 cryptographic characters</span>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label mb-2">Confirm Key</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
        </div>

        <div class="col-12 mt-5">
          <button type="submit" class="btn btn-register" id="submitBtn">
            <span class="spinner-border spinner-border-sm d-none me-2" id="loader"></span>
            Request Credentials
          </button>
        </div>
      </div>
    </form>

    <div class="login-link">
      <span class="text-muted">Already verified?</span> <a href="/login">Initialize Session</a>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById("password");
    const lengthDot = document.getElementById("lengthDot");

    passwordInput.addEventListener("input", function () {
      if (this.value.length >= 6) {
        lengthDot.classList.add("met");
      } else {
        lengthDot.classList.remove("met");
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const submitBtn = document.getElementById("submitBtn");
      const loader = document.getElementById("loader");

      if (password !== confirmPassword) {
        showError("Authentication keys do not match");
        return;
      }

      submitBtn.disabled = true;
      loader.classList.remove("d-none");

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password, confirm_password: confirmPassword }),
        });

        const data = await response.json();

        if (data.success) {
          showSuccess("Identity created. Redirecting to gateway...");
          setTimeout(() => {
            window.location.href = data.redirect;
          }, 1500);
        } else {
          showError(data.message || "Credential issuance failed");
          submitBtn.disabled = false;
          loader.classList.add("d-none");
        }
      } catch (error) {
        showError("Identity server unreachable");
        submitBtn.disabled = false;
        loader.classList.add("d-none");
      }
    });

    function showError(message) {
      const alert = document.getElementById("errorAlert");
      alert.textContent = message;
      alert.classList.remove("d-none");
      document.getElementById("successAlert").classList.add("d-none");
    }

    function showSuccess(message) {
      const alert = document.getElementById("successAlert");
      alert.textContent = message;
      alert.classList.remove("d-none");
      document.getElementById("errorAlert").classList.add("d-none");
    }
  </script>
</body>

</html>
